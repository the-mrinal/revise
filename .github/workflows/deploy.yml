name: Deploy

# Production runs on the homelab, which GitHub can't reach. Running this
# workflow is the deploy request: the homelab checks for new successful runs
# every two minutes (scripts/homelab-deploy.sh) and deploys the exact commit
# this run was started on — pick a branch in "Run workflow" to deploy it.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Record the deploy request
        run: |
          {
            echo "## Deploy requested"
            echo "Commit \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`."
            echo "The homelab deploys it within about 2 minutes. Its log: \`~/revise-deploy.log\` on the homelab."
          } >> "$GITHUB_STEP_SUMMARY"
