name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Same Postgres version as production; the database tests build fresh
      # databases on it from server/migrations/pg.
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r server/requirements-dev.txt
      - name: Run tests
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
        run: pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ruff
        # Same version as server/requirements-dev.txt, so a new ruff release
        # can't fail CI on code that passes locally.
        run: pip install "$(grep '^ruff==' server/requirements-dev.txt)"
      - name: Run ruff
        run: ruff check server/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build server image
        run: docker build -f server/Dockerfile .

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build extension.zip
        working-directory: extension
        run: zip -r ../extension.zip . -x "*.DS_Store"
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: extension.zip
